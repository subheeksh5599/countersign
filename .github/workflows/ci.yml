name: countersign

on: [push, pull_request]

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: behaviour suite
        run: python3 tests/test_gate.py
      - name: matrix suite
        run: python3 tests/test_matrix.py -j 4
      - name: install smoke test
        run: sh install.sh --global
